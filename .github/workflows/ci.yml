name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Runtime and protocol integration tests
        run: pnpm test:integration
      - name: Real HTTP smoke test
        run: pnpm test:smoke

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build container
        run: docker build -t mcp-servers:ci .
