name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Runtime and protocol integration tests
        run: pnpm test:integration
      - name: Real HTTP smoke test
        run: pnpm test:smoke

  conformance-explore:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start reference MCP host
        run: |
          node apps/host/dist/index.js > /tmp/mcp-host.log 2>&1 &
          echo $! > /tmp/mcp-host.pid
          timeout 15 bash -c 'until curl --fail --silent http://127.0.0.1:3000/health >/dev/null; do sleep 0.25; done'
      - name: Explore MCP 2026-07-28 conformance
        continue-on-error: true
        run: |
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11 server \
            --url http://127.0.0.1:3000/mcp/example \
            --suite all \
            --spec-version 2026-07-28 \
            --verbose
      - name: Show host log
        if: always()
        run: cat /tmp/mcp-host.log
      - name: Stop reference MCP host
        if: always()
        run: |
          if [ -f /tmp/mcp-host.pid ]; then
            kill "$(cat /tmp/mcp-host.pid)" || true
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build container
        run: docker build -t mcp-servers:ci .
