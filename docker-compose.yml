services:
  mcp-host:
    build: .
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-api-key}
      MCP_AUTH_STORE: /data/auth-keys.json
      MCP_ALLOW_INSECURE_NO_AUTH: ${MCP_ALLOW_INSECURE_NO_AUTH:-false}
    ports:
      - "${MCP_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - mcp-auth-data:/data

volumes:
  mcp-auth-data:
